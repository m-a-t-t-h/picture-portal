#
# ssh_deployment_path               /var/www/domains/webdevops.uk/pictureportal
#

when:
  - event: push
    evaluate: '(CI_COMMIT_MESSAGE contains "[#staging]")'

steps:

  - name: setup_environment
    image: bash

    environment:
      SSH_PRIVATE_KEY:  { from_secret: athena_deploy_key }
      SSH_USERNAME:     { from_secret: ssh_deploy_username }
      TARGET_SERVER:    { from_secret: ssh_deploy_target_server }
      DEPLOYMENT_PATH:  { from_secret: ssh_deployment_path }

    commands:
      - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "
            mkdir -p $DEPLOYMENT_PATH/staging &&
            mkdir -p $DEPLOYMENT_PATH/staging/deployments &&
            mkdir -p $DEPLOYMENT_PATH/staging/webserver"

  - name: clone_repo
    depends_on: [ setup_environment ]
    image: bash

    environment:
      SSH_PRIVATE_KEY:  { from_secret: athena_deploy_key }
      SSH_USERNAME:     { from_secret: ssh_deploy_username }
      TARGET_SERVER:    { from_secret: ssh_deploy_target_server }
      DEPLOYMENT_PATH:  { from_secret: ssh_deployment_path }
      GITHUB_REPO:      { from_secret: github_repo }

    commands:
      - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "
        cd $DEPLOYMENT_PATH/staging
        && git clone -b ${CI_COMMIT_BRANCH} --single-branch  $GITHUB_REPO deployments/deployment-${CI_PIPELINE_NUMBER}
        && cd deployments/deployment-${CI_PIPELINE_NUMBER}/src
        && ln -s ../../../webserver/.env"


  - name: npm_build
    when: [{ evaluate: 'false' }]
    depends_on: [ clone_repo ]
    image: bash

    commands:
      - docker run -v ".:/usr/src/app"  -w /usr/src/app/src -i node:24.11.1 sh -c "npm i && npm run build"


  - name: upload_built_assets
    when: [{ evaluate: 'false' }]
    depends_on: [ npm_build ]
    image: bash

    environment:
      SSH_PRIVATE_KEY:  { from_secret: athena_deploy_key }
      SSH_USERNAME:     { from_secret: ssh_deploy_username }
      TARGET_SERVER:    { from_secret: ssh_deploy_target_server }
      DEPLOYMENT_PATH:  { from_secret: ssh_deployment_path }

    commands:
      - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - scp -r -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa src/public/build/*  $SSH_USERNAME@$TARGET_SERVER:$DEPLOYMENT_PATH/deployments/deployment-${CI_PIPELINE_NUMBER}/src/public/build/


  - name: composer_install
    when: [{ evaluate: 'false' }]
    depends_on: [ clone_repo ]
    image: bash

    environment:
      SSH_PRIVATE_KEY:  { from_secret: athena_deploy_key }
      SSH_USERNAME:     { from_secret: ssh_deploy_username }
      TARGET_SERVER:    { from_secret: ssh_deploy_target_server }
      DEPLOYMENT_PATH:  { from_secret: ssh_deployment_path }

    commands:
      - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "
        cd $DEPLOYMENT_PATH/deployments/deployment-${CI_PIPELINE_NUMBER}/src
        && composer install"


  - name: bring_deployment_live
    when: [{ evaluate: 'false' }]
    depends_on: [ composer_install, upload_built_assets ]
    image: bash

    environment:
      SSH_PRIVATE_KEY:  { from_secret: athena_deploy_key }
      NGINX_PATH:       { from_secret: nginx_vhost_path }
      SSH_USERNAME:     { from_secret: ssh_deploy_username }
      TARGET_SERVER:    { from_secret: ssh_deploy_target_server }
      DEPLOYMENT_PATH:  { from_secret: ssh_deployment_path }
      IMAGE_MOUNTPOINT: { from_secret: image_mountpoint}

    commands:
      - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "sudo chown www-data:www-data $DEPLOYMENT_PATH/deployments/deployment-${CI_PIPELINE_NUMBER}/ -R"
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "sudo ln -s $IMAGE_MOUNTPOINT $DEPLOYMENT_PATH/deployments/deployment-${CI_PIPELINE_NUMBER}/src/public/images"
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "sudo rm -f $DEPLOYMENT_PATH/live && sudo ln -s $DEPLOYMENT_PATH/deployments/deployment-${CI_PIPELINE_NUMBER}/src $DEPLOYMENT_PATH/live"
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USERNAME@$TARGET_SERVER "sudo service nginx restart"
