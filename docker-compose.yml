#
# This is the DEVELOPMENT docker-compose. Do not use elsewhere.
#

services:

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .infra/dev/backend/Dockerfile
    volumes:
      - ./src:/var/www/html
      - ./.infra/dev/backend/php-local.ini:/usr/local/etc/php/conf.d/local.ini
      - /home/matth/mnt/nfs/pve/dir02:/var/www/html/storage/app/images/svr9
      - /home/matth/mnt/nfs/pve/Main:/var/www/html/storage/app/images/svr5

    env_file: "src/.env"

  frontend:
    depends_on:
      - backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: .infra/dev/frontend/Dockerfile
    ports:
      - '8686:80'
    volumes:
      - ./src:/var/www/html
    links:
      - backend

  npm:
    depends_on:
      - frontend
    restart: unless-stopped
    image: node:24-alpine
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    env_file: "src/.env"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/var/www/html

  queuerunner:
    restart: unless-stopped
    depends_on: [ backend ]
    build:
      context: .
      dockerfile: .infra/dev/queuerunner/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./src:/var/www/html
      - ./.infra/dev/queuerunner/php-local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file: "src/.env"

  scheduler:
    restart: unless-stopped
    depends_on: [ backend ]
    build:
      context: .
      dockerfile: .infra/dev/scheduler/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./src:/var/www/html
      - ./.infra/dev/scheduler/php-local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file: "src/.env"

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db



volumes:
  mailpit_data:

  redis-data:
    driver: local
